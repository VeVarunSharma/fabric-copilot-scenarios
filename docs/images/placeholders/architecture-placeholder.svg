  <text x="750" y="335" text-anchor="middle" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Silver</text>
  <rect x="640" y="400" width="220" height="90" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
