<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Architecture placeholder</title>
  <desc id="desc">Placeholder illustration for the end-to-end Fabric and GitHub architecture.</desc>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect x="40" y="40" width="1520" height="820" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
