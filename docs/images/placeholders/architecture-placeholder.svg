  <text x="1055" y="308" text-anchor="middle" fill="#0c4a6e" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">semantic model</text>
  <rect x="1240" y="230" width="240" height="120" rx="18" fill="#fce7f3" stroke="#ec4899" stroke-width="3"/>
