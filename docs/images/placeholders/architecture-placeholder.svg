  <text x="80" y="132" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="20">Synthetic sources to Fabric medallion flow to Direct Lake semantic model and report</text>
  <rect x="90" y="190" width="220" height="120" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
