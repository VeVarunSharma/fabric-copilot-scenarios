  <text x="330" y="690" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="22">Prompts, reviews, rulesets, automation, security scanning, and release evidence</text>
  <text x="330" y="725" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="22">Replace with approved architecture art or a sanitized platform screenshot</text>
