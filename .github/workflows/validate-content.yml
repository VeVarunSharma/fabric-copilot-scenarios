name: Validate content

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository content
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install the Python project
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ ! -f pyproject.toml ]; then
            echo '::error::pyproject.toml not found. Add the Python project before enabling this workflow.'
            exit 1
          fi
          python -m pip install '.[dev]'

      - name: Run repository validation
        shell: bash
        run: |
          if [ ! -f scripts/validate_repository.py ]; then
            echo '::error::scripts/validate_repository.py not found. Add the repository validator before enabling this workflow.'
            exit 1
          fi
          python scripts/validate_repository.py

      - name: Run test suite
        shell: bash
        run: |
          if [ ! -d tests ]; then
            echo '::error::tests/ directory not found. Add tests before enabling this workflow.'
            exit 1
          fi
          python -m pytest -q
