name: Bug report
description: Report a defect in repository content, automation, or sample artifacts.
title: '[Bug]: '
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve this Microsoft Fabric and GitHub demo repository.

        Please use this form for reproducible defects. Do not disclose vulnerabilities here; follow `SECURITY.md` instead.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Notebooks
        - Pipelines
        - Semantic models / DAX
        - Python scripts
        - Scenarios / documentation
        - GitHub workflows / governance
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the defect and its user impact.
      placeholder: The validation workflow fails because...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide copyable steps, commands, or navigation details.
      placeholder: |
        1. Open ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or sample output
      description: Redact anything sensitive before pasting.
  - type: checkboxes
    id: checklist
    attributes:
      label: Safety checklist
      options:
        - label: I confirmed this issue does not include real secrets or customer data.
          required: true
        - label: I reviewed the existing open issues before submitting this report.
          required: true
